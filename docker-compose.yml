version: '3.9'

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-job_tracker}
      MYSQL_USER: ${MYSQL_USER:-tracker_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tracker_pass}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - job_tracker_mysql:/var/lib/mysql

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      GOOGLE_CLIENT_SECRET_FILE: ./client_secret.json
      GMAIL_TOKEN_FILE: ./token.json
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-10}
      API_TOKEN: ${API_TOKEN:-}
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    volumes:
      - ./frontend:/app

volumes:
  job_tracker_mysql:
